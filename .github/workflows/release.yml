name: Windows Release

on:
  push:
    tags: ['v*.*.*', '*.*.*']

permissions:
  contents: write

jobs:
  package-smoke:
    runs-on: windows-2022
    env:
      RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Smoke-test packaged artifact
        shell: powershell
        run: |
          npx playwright install chromium
          .\scripts\smoke-packaged.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Nextra-${{ github.ref_name }}-windows
          path: |
            Nextra.exe
            Nextra.exe.sha256
      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $titleVersion = $tag -replace '^v', ''
          $notes = @"
          This is an unsigned Windows build. Windows may show an unsigned-app warning.

          Verify Nextra.exe with the attached Nextra.exe.sha256 before running it.
          Desktop Chrome/Edge hosts and viewers plus mobile Chrome viewers are tested;
          other browsers are not tested. Corresponding GPL-3.0 source is the $tag tag.
          "@

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag Nextra.exe Nextra.exe.sha256 --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --title "Nextra $titleVersion" --notes $notes
          } else {
            gh release create $tag Nextra.exe Nextra.exe.sha256 --verify-tag --title "Nextra $titleVersion" --notes $notes
          }
