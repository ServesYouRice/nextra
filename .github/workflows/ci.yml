name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Hosted CI only builds and tests what the dev PC cannot run: the Windows and
# macOS packaged executables. Every Linux check (lint, types, unit and
# integration tests, coverage, build, packaging evaluation, open-source
# preflight, production audit and the browser tests) runs locally in
# .claude/hooks/check.sh (npm run release:prep && npm run test:e2e).
jobs:
  windows-package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run release:prep
      - run: npm run package:artifact
      - run: npx playwright install chromium
      - name: Smoke-test packaged executable
        shell: powershell
        run: node scripts/smoke-packaged.js

  macos-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run release:prep
      - run: npm run package:artifact
      - run: npx playwright install chromium
      - name: Smoke-test packaged executable
        shell: bash
        run: node scripts/smoke-packaged.js
