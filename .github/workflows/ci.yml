name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run release:prep

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run release:prep
      - run: npm run package:artifact
      - name: Smoke-test packaged executable
        shell: powershell
        run: |
          $env:AUTO_PUBLIC_TUNNEL = 'false'
          $env:OPEN_BROWSER = 'false'
          $process = Start-Process -FilePath .\Nextra.exe -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-RestMethod -Uri http://127.0.0.1:3000/readyz -TimeoutSec 2
                if ($response.status -eq 'ready') { $ready = $true; break }
              } catch {}
            }
            if (-not $ready) { throw 'Packaged executable did not become ready.' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
