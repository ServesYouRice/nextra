      <rect x="70" y="42" width="26" height="36" rx="7" fill="none"
            stroke="url(#c22-b)" stroke-width="7" transform="rotate(-8 83 60)"/>
      <circle cx="54" cy="60" r="2.6" fill="#4de3ff"/>
      <circle cx="60" cy="60" r="3.2" fill="#ffffff"/>
      <circle cx="66" cy="60" r="2.6" fill="#a06bff"/>
    </g>
  </defs>
  <rect x="8" y="8" width="104" height="104" rx="27" fill="url(#c22-tile)"
        stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <use href="#c22-art" filter="url(#c22-blur)" opacity="0.65"/>
  <use href="#c22-art"/>
</svg>
