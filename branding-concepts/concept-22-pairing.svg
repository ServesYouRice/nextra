<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Nextra concept: Pairing">
  <defs>
    <linearGradient id="c22-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171a26"/>
      <stop offset="1" stop-color="#0b0c12"/>
    </linearGradient>
    <linearGradient id="c22-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4de3ff"/>
      <stop offset="1" stop-color="#5b8def"/>
    </linearGradient>
    <linearGradient id="c22-b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8def"/>
      <stop offset="1" stop-color="#a06bff"/>
    </linearGradient>
    <filter id="c22-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
    <g id="c22-art">
      <rect x="24" y="42" width="26" height="36" rx="7" fill="none"
