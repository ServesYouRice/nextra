<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Nextra concept: Neon Marquee Deluxe">
  <defs>
    <linearGradient id="c20-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14161f"/>
      <stop offset="1" stop-color="#090a0f"/>
    </linearGradient>
    <linearGradient id="c20-aurora" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4de3ff"/>
      <stop offset="0.5" stop-color="#5b8def"/>
      <stop offset="1" stop-color="#a06bff"/>
